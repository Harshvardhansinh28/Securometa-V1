services:
  mysql:
    image: mysql:8.4
    container_name: soc-platform-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: soc_platform
      MYSQL_USER: soc_user
      MYSQL_PASSWORD: soc_password_change_me
    ports:
      - "3307:3306"
    volumes:
      - soc_mysql_data:/var/lib/mysql
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci"
      ]

volumes:
  soc_mysql_data: